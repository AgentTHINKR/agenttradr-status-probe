name: uptime
# R104b external uptime probe for agenttradr.com. Source of truth: agenttradr-members deploy/external-probe/.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send one TEST Pushover instead of probing'
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe agenttradr.com
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: uptime.yml
          TEST: ${{ inputs.test }}
        run: python3 -I probe.py
